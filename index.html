<style>

:root[data-theme="dark"]{
  --bg:#24130F;--surface:#321D17;--ink:#F6E9DF;--muted:#BCA79A;--chili:#F0533A;--fish:#F79235;--dough:#FBF6EC;--line:#4A2C24;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

.chips{display:flex;gap:8px}

  padding:8px 4px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;line-height:1.2}

.chip[aria-pressed="true"] span{color:#FFE2D8}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--fish);outline-offset:2px}
.chip:disabled{opacity:.45}

canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
#cv{top:calc(50% - 15px)}
.foot{flex:0 0 auto;min-height:168px;display:flex;flex-direction:column;justify-content:center}

.stats div{font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.bars{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bars i{display:block;height:100%}
.emoji{font-size:11px;letter-spacing:0;line-height:1.3;white-space:nowrap;overflow:hidden}
.meta{margin:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 8px;

.btn.x{background:var(--ink);color:var(--bg)}
.btn.again{background:var(--fish);color:#2B1A14}
.btn.copy{flex:0 0 auto;background:transparent;color:var(--ink);border:2px solid var(--line);padding-inline:14px}
.toast{font-size:12px;color:var(--muted);text-align:center;min-height:1em}

.sheet{position:fixed;inset:0;z-index:5;background:rgba(20,10,6,.55);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{background:var(--surface);border-radius:10px;padding:12px;width:100%;max-width:440px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.sheet img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:none;user-select:none}
.note{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<body>
<div class="wrap">
  <header>
    <div class="noren">
      <h1><ruby>麻辣湯<rt>マーラータン</rt></ruby>の<span class="o">例のあれ</span></h1>
    </div>
    <div class="best" id="best">自己ベスト<b>—</b></div>
  </header>

  <div class="chips" role="group" aria-label="縞の本数">
    <button class="chip" id="m4" data-n="4" aria-pressed="false">4本<span>まかない</span></button>
    <button class="chip" id="m8" data-n="8" aria-pressed="true">8本<span>屋台</span></button>
    <button class="chip" id="m12" data-n="12" aria-pressed="false">12本<span>名人・ゆらぐ</span></button>
  </div>

  <div class="stage" id="stage" aria-label="団子の皿。押している間オレンジを塗る">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">押したら回り出す。<em>押してる間だけオレンジ</em></div>
  </div>

  <div class="foot">
    <p class="rule" id="rule">団子は1周だけ回ります。オレンジの縞を8本、白とかわりばんこに同じ幅で巻いてください。</p>
    <section class="slip" id="slip" hidden>
      <div class="slip-top">
        <div class="score" id="score">0<small>点</small></div>
        <div class="rank">職人度<b id="rank">—</b></div>
      </div>
      <p class="meta" id="meta"></p>
      <div class="emoji" id="emoji"></div>
      <p class="tip" id="tip"></p>
      <div class="row">
        <button class="btn again" id="again">もう1個巻く</button>
        <button class="btn x" id="share">Xに投稿</button>
      </div>
    </section>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-label="投稿する画像">
    <img id="card" alt="結果の画像">
    <p class="note" id="note">画像を長押し（PCは右クリック）で保存して、Xの投稿に添付してください。</p>
    <div class="row">
      <a class="btn x" id="toX" href="#" target="_blank" rel="noopener">画像をコピーしてXを開く</a>
      <button class="btn copy" id="close">閉じる</button>
    </div>
  </div>
</div>
<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
const MODES={4:{T:3.4,wob:0,name:'まかない'},8:{T:4.8,wob:0,name:'屋台'},12:{T:6.0,wob:.32,name:'名人'}};
let N=8, phase='ready', d=0, T=3.5, holding=false, bounds=[], rot=0, last=0, wobPhase=0, idle=0, result=null, twist=0, twisting=false, torn=false, needRelease=false, armAt=0, pDown=false;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function showBest(){const b=store.get('shima-best-'+N);$('best').innerHTML='自己ベスト（'+N+'本）<b>'+(b?b+'点':'—')+'</b>'}
function setMode(n){N=n;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.n===n)));
  $('rule').textContent='オレンジの縞を'+n+'本、白とかわりばんこに同じ幅で巻いてください。'+(MODES[n].wob?'回る速さがゆらぎます。':'');reset();showBest()}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{if(phase==='ready'||phase==='done')setMode(+c.dataset.n)}));
function reset(){phase='ready';d=0;rot=0;holding=false;bounds=[];result=null;twist=0;twisting=false;torn=false;needRelease=false;$('slip').hidden=true;$('sheet').hidden=true;$('rule').hidden=false;
  $('hint').innerHTML='押したら回り出す。<em>押してる間だけオレンジ</em>';$('hint').hidden=false;
  document.querySelectorAll('.chip').forEach(c=>c.disabled=false)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function down(e){e.preventDefault();pDown=true;
  if(phase==='twist'){if(performance.now()<armAt||needRelease||twisting)return;twisting=true;$('hint').hidden=true;buzz(10);return}
  if(phase==='ready'){phase='spin';const m=MODES[N];T=m.T*(0.92+Math.random()*0.16);wobPhase=Math.random()*6.28;
    bounds=[{c:'o',a:0}];holding=true;last=performance.now();$('hint').hidden=true;
    document.querySelectorAll('.chip').forEach(c=>c.disabled=true);buzz(12);return}
  if(phase==='spin'&&!holding){holding=true;bounds.push({c:'o',a:d});buzz(10)}
}
function up(){pDown=false;if(phase==='spin'&&holding){holding=false;bounds.push({c:'w',a:d});return}
  if(phase==='twist'){if(needRelease){needRelease=false;return}if(twisting)finalize()}}
stage.addEventListener('pointerdown',down);
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
stage.addEventListener('contextmenu',e=>e.preventDefault());
['touchstart','touchmove','touchend'].forEach(t=>stage.addEventListener(t,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));
document.addEventListener('selectstart',e=>{if(!e.target.closest||!e.target.closest('.emoji'))e.preventDefault()});
function stripes(){
  const segs=[];for(let i=0;i<bounds.length;i++){const a=bounds[i].a,b=i+1<bounds.length?bounds[i+1].a:360;if(b-a>0.01)segs.push({c:bounds[i].c,w:b-a})}
  const m=[];segs.forEach(s=>{if(m.length&&m[m.length-1].c===s.c)m[m.length-1].w+=s.w;else m.push({...s})});
  if(m.length>1&&m[0].c===m[m.length-1].c){m[0].w+=m.pop().w}
  return m;
}
function colorAt(x){let c='w';for(const b of bounds){if(b.a<=x)c=b.c;else break}return c}
function toTwist(){
  holding=false;phase='done';doneAt=performance.now();buildLut();
  const s=stripes();const oc=s.filter(x=>x.c==='o').length;const cnt=s.length;
  const ideal=360/Math.max(cnt,1);const dev=s.reduce((t,x)=>t+Math.abs(x.w-ideal),0)/Math.max(cnt,1);
  let even=100-(dev/ideal)*140;if(cnt<2)even=0;
  const sc=Math.round(Math.max(0,Math.min(100,even-14*Math.abs(oc-N))));
  const ws=s.map(x=>x.w);result={s,oc,sc,max:Math.max(...ws),min:Math.min(...ws)};
  $('hint').hidden=true;
  const prev=+store.get('shima-best-'+N)||0;if(sc>prev)store.set('shima-best-'+N,sc);showBest();
  renderSlip();makeCard();buzz([20,40,20]);
  document.querySelectorAll('.chip').forEach(c=>c.disabled=false);
}
const headline=sc=>'麻辣湯の例のあれ「'+rankOf(sc)+'」';
function rankOf(sc){return sc>=95?'伝説の団子職人':sc>=85?'屋台の看板':sc>=70?'一人前':sc>=50?'見習い':sc>=30?'まかない係':'具が迷子'}
function renderSlip(){
  const r=result;$('score').innerHTML=r.sc+'<small>点</small>';$('rank').textContent=rankOf(r.sc);
  $('meta').textContent='オレンジ '+r.oc+' / '+N+'本 ・ いちばん太い '+Math.round(r.max)+'° ・ 細い '+Math.round(r.min)+'°';
  let em='';for(let i=0;i<24;i++)em+=colorAt((i+.5)*15)==='o'?'🟧':'⬜';$('emoji').textContent=em;
  const txt=headline(r.sc)+'\n'+N+'本しま｜'+r.sc+'点\n'+em+'\n'+TAG;
  result.txt=txt;$('tip').innerHTML='<b>小ネタ</b>'+TIPS[Math.floor(Math.random()*TIPS.length)];
  $('rule').hidden=true;$('slip').hidden=false;
}
$('again').addEventListener('click',()=>reset());
const TIPS=[
  '「麻」は花椒（ホアジャオ）のしびれ、「辣」は唐辛子の辛さのこと。',
  '中国語では「麻辣烫」と書き、マーラータンと読む。',
  '「烫（タン）」は、熱い湯でさっと煮るという意味。',
  '日本の店では「麻辣湯」と書くことが多い。中国語の「湯」はスープのこと。',
  '「辣油（ラー油）」の「辣」も、辛いという意味。',
  '唐辛子は中国語で「辣椒（ラージャオ）」。',
  '胡椒と花椒は別の植物。胡椒はコショウ科、花椒はミカン科。',
  '「香辣」は香ばしい辛さ、「麻辣」はしびれる辛さ。辛さにも言い分けがある。',
  'スープなしで炒めて作るのは「麻辣香鍋（マーラーシャングォ）」。麻辣湯とは別の料理。',
  '「冒菜（マオツァイ）」は四川の料理で、「一人用の火鍋」とも呼ばれる。',
  '串に刺した具を鍋で煮る四川の料理は「串串香（チュアンチュアンシャン）」。',
  'インスタント麺は中国語で「方便面」。麻辣湯に入れられる店もある。',
  '四川の楽山が発祥という説がよく知られている。',
  '串に刺した具を鍋で煮る屋台から広まった、という説がある。',
  '長江の船乗りが、鍋で具を煮て食べたのが始まりという言い伝えもある。',
  'いまは中国の各地に広まり、地域ごとに味が違う。',
  '中国の東北地方の麻辣湯は、ごまだれを入れたまろやかな味が多い。',
  '中国では、仕上げにごまだれ・酢・ラー油を好みで足して食べることが多い。',
  '唐辛子はアメリカ大陸の作物。中国に伝わったのは16世紀の終わりごろとされる。',
  '花椒は、唐辛子よりずっと昔から中国で使われてきた香辛料。',
  '唐辛子が伝わる前、四川の辛みは花椒やしょうがなどが担っていたとされる。',
  '四川省の省都は成都。四川料理の本場として知られる。',
  '四川料理は「一菜一格、百菜百味」と言われ、味の種類が多いことで知られる。',
  '四川料理の「怪味」は、甘い・酸っぱい・辛い・しびれるを合わせた味。',
  '日本では2023年から2024年ごろに、麻辣湯の専門店が一気に増えた。',
  '日本の専門店では、具を自分でボウルに取り、重さで値段が決まる店が多い。',
  '辛さとしびれを、別々に選べる店が多い。',
  '辛さを「なし」にできる店もある。辛いのが苦手でも食べられる。',
  'トマトや白湯など、辛くないスープを選べる店もある。',
  'ボウルに取った具は、店の人がまとめて煮てくれる。',
  '麺は、春雨や中華麺などから選べる店が多い。',
  '仕上げに酢を少し足して、さっぱりさせて食べる人もいる。',
  '花椒はミカン科の木の実の皮。日本の山椒の仲間。',
  '花椒には、赤い「紅花椒」と緑の「青花椒」がある。',
  '青花椒は、さわやかな香りが特徴と言われる。',
  '花椒のしびれのもとは「サンショオール」という成分。',
  '花椒のしびれは、舌に細かい振動のような感覚を起こすという研究がある。',
  '花椒は粒のまま噛むと、強いしびれを感じる。',
  '日本の山椒も花椒の仲間。うなぎにかける粉山椒でも、しびれを楽しめる。',
  '唐辛子の辛さのもとは「カプサイシン」という成分。',
  'カプサイシンは油に溶けやすい。だからラー油に辛さが移る。',
  '辛さの強さを表す単位に「スコヴィル値」がある。',
  '辛いものを食べて汗が出るのは、カプサイシンが体に「熱い」と感じさせるから。',
  '辛さが強いときは、水より牛乳のほうがやわらぐと言われる。',
  '豆板醤は、そら豆と唐辛子から作る発酵調味料。',
  '豆板醤の名産地として、四川の郫県（ピーシェン）がよく知られる。',
  '「朝天椒」は、実が空を向いてなる唐辛子。四川料理でよく使われる。',
  '八角（スターアニス）は星の形の香辛料。中華のスープの香りづけに使われる。',
  '火鍋のスープのもとには、牛脂で唐辛子や花椒を炒めて作るものがある。',
  '桂皮（シナモンの仲間）や草果も、麻辣の香りづけに使われることがある。',
  '定番の具の春雨は、緑豆などのでん粉から作る麺。',
  '細い春雨は「粉絲（フェンスー）」、太めのものは「粉条」と呼ばれる。',
  'さつまいものでん粉から作る、太くてもちもちした春雨もある。',
  '「寛粉（クアンフェン）」は、幅の広い平たい春雨。',
  '「腐竹（フージュー）」は、湯葉を棒状に乾かしたもの。スープをよく吸う。',

    for(const sgn of[-1,1]){ctx.save();ctx.translate(cx+sgn*gap,ty);ctx.rotate(sgn*(0.5+twist*0.004));
      ctx.beginPath();ctx.ellipse(sgn*R*.22,-R*.05,R*.26,R*.13,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(sgn*R*.08,-R*.07,R*.07,R*.05,0,0,7);ctx.fill();ctx.restore()}
    ctx.restore();
    const gw=W*0.62,gx=cx-gw/2,gy=W*0.08,gh=10;
    ctx.save();ctx.fillStyle=css('--line');ctx.beginPath();ctx.roundRect(gx,gy,gw,gh,5);ctx.fill();
    ctx.fillStyle=css('--fish');ctx.globalAlpha=.45;ctx.fillRect(gx+gw*(140/360),gy,gw*(80/360),gh);ctx.globalAlpha=1;
    ctx.fillStyle=css('--chili');ctx.beginPath();ctx.roundRect(gx,gy,gw*Math.min(1,twist/360),gh,5);ctx.fill();
    ctx.fillStyle=css('--muted');ctx.font='700 11px '+css('--body');ctx.textAlign='left';ctx.fillText('ねじり',gx,gy-6);
    ctx.textAlign='right';ctx.fillText('ちぎれる',gx+gw,gy-6);ctx.restore();
    if(twisting&&twist>290){const k=(twist-290)/70*3;ctx.translate((Math.random()-.5)*k,0)}
  }
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(phase==='spin'){const m=MODES[N];const rate=1+m.wob*Math.sin(wobPhase+d/360*Math.PI*2*2.3);
    d+=360/T*rate*dt;if(d>=360){d=360;rot=360;toTwist()}else rot=d}
  else if(phase==='twist'){rot+=dt*36;if(twisting){twist+=dt*(150+twist*0.5);if(twist>=360){twist=360;torn=true;finalize()}}}
  else if(phase==='done'){rot+=dt*36}
  else{idle+=dt;rot=Math.sin(idle*1.4)*3}
  draw(now);requestAnimationFrame(loop);
}
showBest();last=performance.now();requestAnimationFrame(loop);
})();
</script>
